<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/popup.css">
  <script src="js/lib/jszip.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/markdown-utils.js"></script>
  <script src="js/jszip-integration.js"></script>
</head>
<body>
  <div class="app">
    <!-- Ambient background -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <!-- Header -->
    <header class="header">
      <div class="header__brand">
        <img src="images/icon48.png" alt="" class="header__logo" />
        <div class="header__text">
          <h1 class="header__title">Knowledge Builder</h1>
          <span class="header__subtitle">by Navis.Digital</span>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Tab Navigation -->
    <nav class="tabs">
      <button class="tab tab--active" data-tab="collect">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Collect
      </button>
      <button class="tab" data-tab="options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Options
      </button>
      <button class="tab" data-tab="export">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Export
      </button>
    </nav>

    <!-- Tab: Collect -->
    <section class="panel panel--active" id="panel-collect">
      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn mode-btn--active" data-mode="scan">Scan Page</button>
        <button class="mode-btn" data-mode="manual">Manual URLs</button>
      </div>

      <!-- Scan mode -->
      <div class="mode-content mode-content--active" id="mode-scan">
        <div class="field">
          <label class="field__label">Include pattern <span class="field__hint" title="Regex: only URLs matching this pattern">(regex)</span></label>
          <input type="text" id="include-pattern" class="field__input" placeholder="e.g. /docs/ or promptingguide\\.ai">
        </div>
        <div class="field">
          <label class="field__label">Exclude pattern <span class="field__hint" title="Regex: URLs matching this will be excluded">(regex)</span></label>
          <input type="text" id="exclude-pattern" class="field__input" placeholder="e.g. /blog/|/auth/">
        </div>
        <button id="scan-page" class="btn btn--primary btn--full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Scan Current Page
        </button>
      </div>

      <!-- Manual mode -->
      <div class="mode-content" id="mode-manual">
        <div class="field">
          <label class="field__label">Enter URLs (one per line)</label>
          <textarea id="manual-urls" class="field__textarea" rows="6" placeholder="https://www.promptingguide.ai/introduction&#10;https://www.promptingguide.ai/techniques&#10;..."></textarea>
        </div>
        <button id="add-manual-urls" class="btn btn--primary btn--full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add URLs
        </button>
      </div>

      <!-- URL List -->
      <div id="url-list-section" class="url-section hidden">
        <div class="url-section__header">
          <h3 class="url-section__title">
            Collected URLs
            <span id="url-count" class="badge">0</span>
          </h3>
          <button id="clear-urls" class="btn btn--ghost btn--sm">Clear All</button>
        </div>
        <div id="url-list" class="url-list"></div>
      </div>
    </section>

    <!-- Tab: Options -->
    <section class="panel" id="panel-options">
      <div class="card">
        <h3 class="card__title">Content</h3>
        <label class="toggle-row">
          <input type="checkbox" id="include-headings" checked>
          <span class="toggle-row__label">Include headings</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="include-images" checked>
          <span class="toggle-row__label">Include images</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="include-links" checked>
          <span class="toggle-row__label">Include links</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="include-code-blocks" checked>
          <span class="toggle-row__label">Include code blocks</span>
        </label>
      </div>

      <div class="card">
        <h3 class="card__title">Advanced</h3>
        <div class="field">
          <label class="field__label">Remove selectors</label>
          <input type="text" id="remove-selectors" class="field__input" placeholder=".ad, .popup, .banner">
        </div>
        <div class="field">
          <label class="field__label">Page load timeout (ms)</label>
          <input type="number" id="tab-load-timeout" class="field__input" min="3000" step="1000" value="15000">
        </div>
      </div>

      <div class="card">
        <h3 class="card__title">Output</h3>
        <label class="toggle-row">
          <input type="checkbox" id="create-index" checked>
          <span class="toggle-row__label">Create index file</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="add-frontmatter" checked>
          <span class="toggle-row__label">Add YAML frontmatter</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="add-table-of-contents">
          <span class="toggle-row__label">Add table of contents</span>
        </label>
      </div>
    </section>

    <!-- Tab: Export -->
    <section class="panel" id="panel-export">
      <div class="card">
        <div class="field">
          <label class="field__label">Filename</label>
          <div class="field__row">
            <input type="text" id="output-filename" class="field__input" value="knowledge-base">
            <span class="field__suffix">.zip</span>
          </div>
        </div>
      </div>

      <div class="action-stack">
        <button id="extract-content" class="btn btn--accent btn--full" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Extract All Pages
        </button>
        <button id="download-zip" class="btn btn--primary btn--full" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download ZIP
        </button>
      </div>

      <!-- Extraction Controls (shown during extraction) -->
      <div id="extraction-controls" class="extraction-controls hidden">
        <button id="pause-btn" class="ctrl-btn ctrl-btn--warn" title="Pause">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button id="resume-btn" class="ctrl-btn ctrl-btn--ok hidden" title="Resume">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="stop-btn" class="ctrl-btn ctrl-btn--danger" title="Stop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        </button>
      </div>
    </section>

    <!-- Status Bar (always visible at bottom when active) -->
    <div id="status-bar" class="status-bar hidden">
      <div class="status-bar__progress">
        <div id="progress-fill" class="status-bar__fill"></div>
      </div>
      <p id="status-text" class="status-bar__text">Ready</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Knowledge Builder v2.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
