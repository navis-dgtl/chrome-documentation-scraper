<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #14171f;
      --text: #e4e8f1;
      --text-muted: #8892a8;
      --accent: #5b8aff;
      --border: #2a3040;
      --code-bg: #1a1e28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.7; padding: 40px 20px;
    }
    #content {
      max-width: 780px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px;
    }
    h1, h2, h3, h4, h5, h6 { color: var(--text); margin: 1.5em 0 0.5em; line-height: 1.3; }
    h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    h2 { font-size: 22px; color: var(--accent); }
    h3 { font-size: 18px; }
    p { margin: 0.8em 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    }
    pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; overflow-x: auto;
      margin: 1em 0;
    }
    pre code { background: none; padding: 0; }
    blockquote {
      border-left: 3px solid var(--accent); padding-left: 16px;
      color: var(--text-muted); margin: 1em 0;
    }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td {
      border: 1px solid var(--border); padding: 8px 12px; text-align: left;
    }
    th { background: var(--code-bg); font-weight: 600; }
    ul, ol { margin: 0.8em 0; padding-left: 24px; }
    li { margin: 0.3em 0; }
    img { max-width: 100%; border-radius: 8px; margin: 1em 0; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    .loading { text-align: center; color: var(--text-muted); padding: 60px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/viewer.js"></script>
</head>
<body>
  <div id="content"><p class="loading">Loading preview...</p></div>
</body>
</html>
